<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>編集報告システム</title>

  <!-- 検索エンジンのインデックス化を防止 -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="slurp" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="duckduckbot" content="noindex, nofollow, noarchive, nosnippet">

  <!-- Google検索結果からの削除要求 -->
  <meta name="google" content="nositelinkssearchbox">
  <meta name="google" content="notranslate">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- ログイン画面 -->
  <div id="login-screen" class="hidden">
    <div class="login-container">
      <h1>編集報告システム</h1>
      <div class="form-group">
        <label>メールアドレス</label>
        <input type="email" id="login-user-id" placeholder="メールアドレスを入力">
      </div>
      <div class="form-group">
        <label>パスワード</label>
        <input type="password" id="login-password" placeholder="パスワードを入力">
      </div>
      <div class="form-group" style="display: flex; align-items: center; margin-top: 10px;">
        <input type="checkbox" id="login-remember-me" style="width: auto; margin: 0; margin-right: 8px;">
        <label for="login-remember-me" style="margin: 0; cursor: pointer;">ログイン状態を保持</label>
      </div>
      <button class="btn btn-primary" onclick="handleLogin()" style="width: 100%;">ログイン</button>
      <div id="login-message"></div>
    </div>
  </div>

  <!-- メイン画面 -->
  <div id="main-screen" class="hidden">
    <!-- ヘッダー -->
    <div class="header">
      <h1 style="cursor: pointer;" onclick="showDashboard()">編集報告システム</h1>
      <div class="user-info">
        <span id="user-name-display"></span>
        <button class="btn btn-secondary" onclick="handleLogout()">ログアウト</button>
      </div>
    </div>

    <div class="container">
      <!-- メニュー画面 -->
      <div id="menu-screen">
        <div class="card">
          <h2>メニュー</h2>
          <div class="menu-grid" id="menu-grid">
            <!-- メニューは権限に応じて動的に生成されます -->
          </div>
        </div>
      </div>

      <!-- 各画面のコンテンツはJavaScriptで動的に生成 -->
      <div id="dashboard-screen" class="hidden"></div>
      <div id="project-registration-screen" class="hidden"></div>
      <div id="project-search-screen" class="hidden"></div>
      <div id="project-detail-screen" class="hidden"></div>
      <div id="project-edit-screen" class="hidden"></div>
      <div id="edit-time-registration-screen" class="hidden"></div>
      <div id="approval-search-screen" class="hidden"></div>
      <div id="approval-detail-screen" class="hidden"></div>
      <div id="admin-screen" class="hidden"></div>
    </div>
  </div>

  <!-- Supabase JS Library (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- JavaScript -->
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/project.js"></script>
  <script src="js/project_edit.js"></script>
  <script src="js/project_lists.js"></script>
  <script src="js/editTime.js"></script>
  <script src="js/approval.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
